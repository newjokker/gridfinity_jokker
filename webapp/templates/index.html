<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#142019"><title>Gridfinity 参数化模型工坊</title>
  <style>
    :root{--ink:#142019;--green:#2f7854;--orange:#e98248;--paper:#f2efe7;--card:#fffdf8;--line:#d8d4c8;--muted:#69716b}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 12% 0,#fff7e7 0,transparent 38%),var(--paper);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:980px;margin:auto;padding:54px 26px 70px}.eyebrow{color:var(--green);font:700 12px/1 monospace;letter-spacing:.16em;text-transform:uppercase}h1{max-width:850px;margin:14px 0 13px;font-size:clamp(42px,7vw,78px);line-height:.98;letter-spacing:-.055em}.lead{max-width:700px;margin:0;color:var(--muted);font-size:17px;line-height:1.7}.status{display:inline-flex;align-items:center;gap:7px;margin-top:20px;padding:9px 13px;border:1px solid #bdd0c2;border-radius:999px;color:var(--green);background:#edf5ef;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:42px}.card{display:flex;min-height:260px;flex-direction:column;padding:24px;border:1px solid var(--line);border-radius:22px;color:inherit;background:rgba(255,253,248,.94);box-shadow:0 18px 48px rgba(32,40,34,.07);text-decoration:none;transition:.18s}.card:hover{transform:translateY(-4px);border-color:#aebfb3;box-shadow:0 22px 52px rgba(32,40,34,.12)}.num{font:700 12px monospace;color:var(--green)}.icon{display:grid;width:52px;height:52px;margin:24px 0 18px;place-items:center;border-radius:15px;color:white;background:var(--ink);font-size:25px}.card:nth-child(2) .icon{background:var(--orange)}h2{margin:0 0 9px;font-size:23px}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}.go{margin-top:auto;padding-top:22px;color:var(--green);font-weight:750;font-size:13px}.audit{margin-top:34px;padding-top:21px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}@media(max-width:800px){.shell{padding:35px 16px 50px}.grid{grid-template-columns:1fr}.card{min-height:220px}}
  </style>
</head>
<body><div class="shell">
  <div class="eyebrow">Gridfinity Parametric Workshop</div><h1>一个入口，生成所有收纳模型。</h1>
  <p class="lead">从抽屉底板、标准分仓盒，到轴承、电池、磁铁和电机专用阵列盒。设置参数，在线预览，直接下载 STL。</p><div class="status">● 服务已就绪 · OpenSCAD Nightly</div>
  <main class="grid">
    <a class="card" href="/baseplates"><span class="num">01 / BASEPLATE</span><span class="icon">▦</span><h2>抽屉底板</h2><p>按抽屉尺寸自动排版和拆件，支持单块 3D 预览、单独下载或整包下载。</p><span class="go">打开底板生成器 →</span></a>
    <a class="card" href="/bins"><span class="num">02 / BIN & ARRAY</span><span class="icon">▣</span><h2>盒子与阵列</h2><p>生成普通分仓盒、圆孔阵列或矩形阵列；矩形孔可直接指定长和宽。</p><span class="go">打开盒子生成器 →</span></a>
  </main>
  <p class="audit">盒子生成器已统一支持普通分仓、圆孔阵列和自定义长宽的矩形阵列。</p>
</div></body></html>
