<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#142019">
  <title>Gridfinity 盒子生成器</title>
  <style>
    :root{--ink:#142019;--green:#2f7854;--orange:#ee8a4c;--paper:#f2efe7;--card:#fffdf8;--line:#d8d4c8;--muted:#69716b}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--ink);background:radial-gradient(circle at 12% 0,#fff7e7 0,transparent 38%),var(--paper);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:1380px;margin:auto;padding:30px 28px 56px}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:var(--green);font:700 12px/1 monospace;letter-spacing:.15em;text-transform:uppercase}h1{margin:9px 0 7px;font-size:clamp(32px,4vw,54px);line-height:1;letter-spacing:-.045em}header p{margin:0;color:var(--muted)}.nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.back{padding:10px 14px;border:1px solid #bcd0c2;border-radius:999px;color:var(--green);background:#eff6f1;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
    main{display:grid;grid-template-columns:390px 1fr;gap:20px}.card{background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(32,40,34,.07)}form{padding:23px;max-height:760px;overflow:auto}.error{display:none;margin-bottom:14px;padding:10px 12px;border-radius:10px;color:#9c351f;background:#fff0eb;font-size:13px}.group-title{margin:0 0 13px;font:700 12px/1 monospace;color:var(--muted);letter-spacing:.1em}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}label{display:grid;gap:6px;color:var(--muted);font-size:12px}.wide{grid-column:1/-1}input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:white;font:650 14px/1 inherit;outline:none}input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,120,84,.12)}input[type=range]{padding:0;accent-color:var(--orange)}.switch{display:flex;align-items:center;justify-content:space-between;min-height:38px}.switch input{width:40px;height:22px;accent-color:var(--green)}.range-value{color:var(--green);font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:-23px;padding:14px 0 1px;background:linear-gradient(transparent,#fffdf8 28%)}button{border:0;border-radius:12px;padding:13px 15px;color:white;background:var(--ink);font-weight:750;font-size:14px;cursor:pointer}button:hover{background:#2d4638}.preview-button{color:#18231d;background:#e6eee8;border:1px solid #bdd0c1}.preview-button:hover{background:#dce9df}.download-button{background:#df7440}.download-button:hover{background:#ee8a4c}.hint{margin:12px 2px 0;color:var(--muted);font-size:11px;line-height:1.55}
    .viewer-card{min-width:0;overflow:hidden}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 20px;border-bottom:1px solid var(--line)}.viewer-head h2{margin:0;font-size:17px}.metrics{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}.metric{padding:7px 9px;border-radius:8px;color:var(--muted);background:#efede5;font-size:12px}.metric strong{color:var(--ink)}#viewer{position:relative;height:650px;overflow:hidden;background:radial-gradient(circle at 48% 34%,rgba(79,111,96,.72) 0,rgba(31,49,40,.5) 38%,transparent 68%),linear-gradient(145deg,#24382e 0,#111b16 72%,#0a110e 100%)}#canvasHost{position:absolute;inset:0}#canvasHost canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}#canvasHost canvas:active{cursor:grabbing}.viewer-toolbar{position:absolute;z-index:3;top:15px;left:15px;right:15px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}.viewer-info{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border:1px solid rgba(238,153,100,.38);border-radius:10px;color:#ffc49d;background:rgba(11,22,17,.82);font-size:12px;font-weight:750;backdrop-filter:blur(8px)}.reset{pointer-events:auto;width:auto;padding:9px 12px;border:1px solid rgba(217,235,224,.28);border-radius:10px;color:white;background:rgba(11,22,17,.78);font-size:12px}.loading{position:absolute;z-index:2;inset:0;display:grid;place-items:center;color:#e7efe9;text-align:center;line-height:1.7;background:rgba(10,17,14,.18);pointer-events:none}.loading[hidden]{display:none}.viewer-foot{display:flex;justify-content:space-between;gap:12px;padding:15px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
    @media(max-width:900px){.shell{padding:22px 15px 40px}header{align-items:start;flex-direction:column}main{grid-template-columns:1fr}form{max-height:none}#viewer{height:500px}.viewer-head{align-items:start;flex-direction:column}.metrics{justify-content:start}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div><div class="eyebrow">Gridfinity Rebuilt Bin</div><h1>盒子与阵列生成器</h1><p>普通分仓、圆孔阵列、矩形阵列，统一生成可直接打印的 STL。</p></div><nav class="nav"><a class="back" href="/">模型首页</a><a class="back" href="/baseplates">底板</a><a class="back" href="/lids">盖子</a><a class="back" href="/pins">插销</a></nav></header>
    <main>
      <form id="binForm" class="card">
        <div id="error" class="error"></div>
        <p class="group-title">01 / 盒子尺寸</p>
        <div class="fields">
          <label>X 网格数<input name="gridx" type="number" min="1" max="10" step="1" value="2"></label>
          <label>Y 网格数<input name="gridy" type="number" min="1" max="10" step="1" value="1"></label>
          <label class="wide">高度单位 U · 每单位 7 mm<input name="gridz" type="number" min="1" max="20" step="1" value="4"></label>
          <label class="switch wide"><span>保留顶部堆叠唇</span><input name="include_lip" type="checkbox" checked></label>
          <label>外壁厚度 · mm<input name="wall_thickness" type="number" min="0.8" max="6" step="0.05" value="2.85"></label>
          <label>分隔墙厚度 · mm<input name="divider_thickness" type="number" min="0.6" max="6" step="0.05" value="2.4"></label>
        </div>
        <p class="group-title">02 / 内部结构</p>
        <div class="fields">
          <label class="wide">生成类型<select name="cut_mode"><option value="compartments">普通分仓</option><option value="circles">圆孔阵列</option><option value="rectangles">矩形阵列</option></select></label>
          <label><span id="xCountLabel">X 分仓数</span><input name="divx" type="number" min="1" max="12" step="1" value="2"></label>
          <label><span id="yCountLabel">Y 分仓数</span><input name="divy" type="number" min="1" max="12" step="1" value="1"></label>
          <div id="compartmentFields" class="wide fields" style="margin:0;display:contents">
            <input name="style_tab" type="hidden" value="5">
            <label class="wide">底部取物圆弧 <span id="scoopValue" class="range-value">50%</span><input name="scoop" type="range" min="0" max="1" step="0.1" value="0.5"></label>
          </div>
          <label id="diameterField" class="wide" hidden>每个圆孔直径 · mm<input name="cylinder_diameter" type="number" min="2" max="40" step="0.1" value="12"></label>
          <div id="rectangleFields" class="wide fields" hidden style="margin:0">
            <label>矩形长度 X · mm<input name="rectangle_length" type="number" min="3" max="200" step="0.1" value="20"></label>
            <label>矩形宽度 Y · mm<input name="rectangle_width" type="number" min="3" max="200" step="0.1" value="15"></label>
            <label class="wide">圆角半径 · mm（0 为直角）<input name="rectangle_radius" type="number" min="0" max="20" step="0.1" value="0.5"></label>
          </div>
          <p id="fitHint" class="hint wide" style="margin:0"></p>
        </div>
        <p class="group-title">03 / 底部孔位</p>
        <div class="fields">
          <label class="wide">孔位样式<select name="hole_style"><option value="0" selected>无孔</option><option value="1">6×2 mm 磁铁孔</option><option value="2">磁铁孔 + M3 螺丝孔</option></select></label>
          <label class="switch wide"><span>仅四角保留孔位</span><input name="only_corners" type="checkbox"></label>
        </div>
        <div class="actions"><button id="preview" class="preview-button" type="button">生成 3D 预览</button><button id="download" class="download-button" type="button">下载 STL</button></div>
      </form>
      <section class="card viewer-card">
        <div class="viewer-head"><h2>真实 STL 预览</h2><div id="metrics" class="metrics"></div></div>
        <div id="viewer" aria-label="盒子 STL 三维预览"><div class="viewer-toolbar"><div class="viewer-info"><span id="modelInfo" class="chip">等待生成</span><span id="modelDimensions" class="chip">长 — · 宽 — · 高 —</span></div><button id="reset" class="reset" type="button">复位视角</button></div><div id="canvasHost"></div><div id="loading" class="loading">设置参数后，点击“生成 3D 预览”<br>拖动旋转 · 滚轮缩放 · 右键平移</div></div>
        <div class="viewer-foot"><span>橙色模型为实际导出的 STL</span><span>标准网格固定为 42 mm</span></div>
      </section>
    </main>
  </div>
  <script src="/static/vendor/three-legacy/build/three.min.js"></script>
  <script src="/static/vendor/three-legacy/examples/js/loaders/STLLoader.js"></script>
  <script src="/static/vendor/three-legacy/examples/js/controls/OrbitControls.js"></script>
  <script src="/static/action-logger.js"></script>
  <script>
    const form=document.querySelector('#binForm'),previewButton=document.querySelector('#preview'),downloadButton=document.querySelector('#download'),errorBox=document.querySelector('#error'),metrics=document.querySelector('#metrics'),loading=document.querySelector('#loading'),viewer=document.querySelector('#viewer'),canvasHost=document.querySelector('#canvasHost'),modelInfo=document.querySelector('#modelInfo'),modelDimensions=document.querySelector('#modelDimensions'),resetButton=document.querySelector('#reset'),scoopValue=document.querySelector('#scoopValue'),diameterField=document.querySelector('#diameterField'),rectangleFields=document.querySelector('#rectangleFields'),compartmentFields=document.querySelector('#compartmentFields'),fitHint=document.querySelector('#fitHint'),xCountLabel=document.querySelector('#xCountLabel'),yCountLabel=document.querySelector('#yCountLabel');
    const loader=new THREE.STLLoader();let renderer=null,scene=null,camera=null,controls=null,mesh=null,outline=null,defaultCamera=null,controller=null;
    function payload(){const data=Object.fromEntries(new FormData(form).entries());['include_lip','only_corners'].forEach(name=>data[name]=form.elements[name].checked);return data}
    function showError(message=''){errorBox.textContent=message;errorBox.style.display=message?'block':'none'}
    function updateSummary(){const data=payload(),x=Number(data.gridx)||0,y=Number(data.gridy)||0,z=Number(data.gridz)||0,cols=Math.max(1,Number(data.divx)||1),rows=Math.max(1,Number(data.divy)||1),wall=Number(data.wall_thickness)||2.85,divider=Number(data.divider_thickness)||2.4,mode=data.cut_mode;scoopValue.textContent=`${Math.round((Number(data.scoop)||0)*100)}%`;diameterField.hidden=mode!=='circles';rectangleFields.hidden=mode!=='rectangles';compartmentFields.hidden=mode!=='compartments';xCountLabel.textContent=mode==='compartments'?'X 分仓数':'阵列列数 X';yCountLabel.textContent=mode==='compartments'?'Y 分仓数':'阵列行数 Y';const cellX=(x*42-.5-2*wall)/cols-divider/2,cellY=(y*42-.5-2*wall)/rows-divider/2;if(mode==='circles')fitHint.textContent=`当前每孔最多约 Ø${Math.max(0,Math.min(cellX,cellY)).toFixed(1)} mm`;else if(mode==='rectangles')fitHint.textContent=`当前每个矩形约可用 ${Math.max(0,cellX).toFixed(1)} × ${Math.max(0,cellY).toFixed(1)} mm`;else fitHint.textContent='普通分仓已使用无悬空挡板的干净切孔';const modeName={compartments:'普通分仓',circles:'圆孔阵列',rectangles:'矩形阵列'}[mode];metrics.innerHTML=`<span class="metric">类型 <strong>${modeName}</strong></span><span class="metric">底面 <strong>${x} × ${y} 格</strong></span><span class="metric">阵列 <strong>${cols} × ${rows}</strong></span><span class="metric">壁厚 <strong>${wall.toFixed(2)} / ${divider.toFixed(2)} mm</strong></span><span class="metric">高度 <strong>${z}U / ${z*7} mm</strong></span>`}
    function initViewer(){if(renderer)return;renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;canvasHost.append(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(38,1,.1,5000);camera.up.set(0,0,1);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.screenSpacePanning=true;scene.add(new THREE.HemisphereLight(0xdcebe3,0x17221c,.68));const key=new THREE.DirectionalLight(0xffd8b8,1.18);key.position.set(160,-120,220);key.castShadow=true;scene.add(key);const fill=new THREE.DirectionalLight(0x98c7d8,.42);fill.position.set(-120,120,100);scene.add(fill);const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshStandardMaterial({color:0x15231c,roughness:1}));ground.position.z=-.65;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(600,30,0x7c9e8d,0x365246);grid.rotation.x=Math.PI/2;grid.position.z=-.5;grid.material.transparent=true;grid.material.opacity=.56;scene.add(grid);const resize=()=>{const rect=viewer.getBoundingClientRect();if(!rect.width||!rect.height)return;renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix()};new ResizeObserver(resize).observe(viewer);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)})}
    function fitCamera(geometry){geometry.computeBoundingBox();const box=geometry.boundingBox,center=new THREE.Vector3();box.getCenter(center);geometry.translate(-center.x,-center.y,-box.min.z);geometry.computeBoundingSphere();const radius=Math.max(geometry.boundingSphere.radius,20),v=THREE.MathUtils.degToRad(camera.fov),h=2*Math.atan(Math.tan(v/2)*camera.aspect),distance=radius/Math.sin(Math.min(v,h)/2)*1.25,target=new THREE.Vector3(0,0,Math.max(2,box.max.z-box.min.z)*.22),direction=new THREE.Vector3(1.25,-1.6,1.15).normalize();defaultCamera={position:direction.multiplyScalar(distance).add(target),target};camera.near=Math.max(.1,distance/150);camera.far=distance*30;camera.position.copy(defaultCamera.position);controls.target.copy(target);controls.minDistance=radius*.35;controls.maxDistance=distance*4;camera.updateProjectionMatrix();controls.update()}
    async function preview(){previewButton.disabled=true;previewButton.textContent='正在生成…';loading.hidden=false;loading.textContent='正在生成并加载盒子 STL…';modelDimensions.textContent='长 生成中… · 宽 生成中… · 高 生成中…';showError();if(controller)controller.abort();controller=new AbortController();try{const data=payload(),response=await fetch('/api/bin-stl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal});if(!response.ok){const result=await response.json();throw new Error(result.error||'盒子生成失败')}const buffer=await response.arrayBuffer(),geometry=loader.parse(buffer);geometry.computeVertexNormals();geometry.computeBoundingBox();const actualSize=new THREE.Vector3();geometry.boundingBox.getSize(actualSize);modelDimensions.textContent=`长 ${actualSize.x.toFixed(1)} · 宽 ${actualSize.y.toFixed(1)} · 高 ${actualSize.z.toFixed(1)} mm`;initViewer();if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}if(outline){scene.remove(outline);outline.geometry.dispose();outline.material.dispose();outline=null}fitCamera(geometry);mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:0xe9783f,roughness:.72,metalness:0,side:THREE.FrontSide}));mesh.castShadow=false;mesh.receiveShadow=false;scene.add(mesh);modelInfo.textContent=`${data.gridx} × ${data.gridy} × ${data.gridz}U 盒子`;loading.hidden=true}catch(error){if(error.name!=='AbortError'){showError(error.message);loading.hidden=false;loading.textContent=error.message}}finally{previewButton.disabled=false;previewButton.textContent='生成 3D 预览'}}
    function download(){const data={...payload(),download:1},a=document.createElement('a');a.href=`/api/bin-stl?${new URLSearchParams(data)}`;a.download=`gridfinity_${data.cut_mode}_${data.gridx}x${data.gridy}x${data.gridz}U.stl`;document.body.append(a);a.click();a.remove()}
    const query=new URLSearchParams(location.search);for(const [name,value] of query){const field=form.elements[name];if(!field)continue;if(field.type==='checkbox')field.checked=['1','true','on','yes'].includes(value);else field.value=value}form.addEventListener('input',updateSummary);form.addEventListener('change',updateSummary);previewButton.addEventListener('click',preview);downloadButton.addEventListener('click',download);resetButton.addEventListener('click',()=>{if(defaultCamera){camera.position.copy(defaultCamera.position);controls.target.copy(defaultCamera.target);controls.update()}});updateSummary();
  </script>
</body>
</html>
